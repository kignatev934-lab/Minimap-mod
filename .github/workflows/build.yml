name: Build mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o *.zip -d proj

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'  # <-- ИЗМЕНЕНО

      - name: Build
        run: |
          PROJ=$(dirname "$(find proj -name build.gradle | head -1)")
          cd "$PROJ"
          gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: floppymap
          path: "**/build/libs/*.jar"
