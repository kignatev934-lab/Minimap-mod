name: Build mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o -q simpleminimap_project.zip -d proj

      - name: Write fixed build.gradle
        run: |
          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'java'
              id 'net.minecraftforge.gradle' version '[7.0,)'
          }

          version = '1.5.0'
          group = 'ru.example'

          base {
              archivesName = 'simpleminimap'
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(25)

          minecraft {
              mappings channel: 'official', version: '26.3'
          }

          repositories {
              minecraft.mavenizer(it)
              maven fg.forgeMaven
              maven fg.minecraftLibsMaven
              mavenCentral()
          }

          dependencies {
              implementation minecraft.dependency("net.minecraftforge:forge:26.3-66.1.0")
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Build
        run: |
          PROJ=$(dirname "$(find proj -name build.gradle | head -1)")
          cd "$PROJ"
          gradle build --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Dump API of 26.3
        if: always()
        run: |
          {
            echo "=== FORGE CLIENT EVENTS ==="
            FU=$(find /home/runner/.gradle/caches/minecraftforge -name '*universal.jar' | head -1)
            echo "jar: $FU"
            unzip -l "$FU" 2>/dev/null | grep -oE "net/minecraftforge/client/event/[A-Za-z$]+\.class" | sort -u
            echo ""
            echo "=== FORGE event/ PACKAGE ==="
            unzip -l "$FU" 2>/dev/null | grep -oE "net/minecraftforge/event/[A-Za-z$/.]+\.class" | sort -u | head -60
            echo ""
            echo "=== JAVAP FORGE EVENTS ==="
            for c in net.minecraftforge.client.event.RegisterGuiLayersEvent net.minecraftforge.client.event.RegisterKeyMappingsEvent net.minecraftforge.client.event.RenderLevelStageEvent net.minecraftforge.client.event.RenderGuiEvent net.minecraftforge.client.event.RenderGuiLayerEvent net.minecraftforge.event.TickEvent net.minecraftforge.client.event.ClientTickEvent 'net.minecraftforge.client.event.InputEvent$MouseButtonPressed' net.minecraftforge.client.extensions.IForgeGuiGraphicsExtractor; do
              echo "--- $c"
              javap -cp "$FU" "$c" 2>&1 | head -30
            done
            echo ""
            echo "=== MC SOURCES SIGNATURES ==="
            SRC=$(find /home/runner/.gradle/caches/minecraftforge -name 'remapped-javadoc.jar' | head -1)
            echo "sources: $SRC"
            rm -rf srcs && mkdir -p srcs
            (cd srcs && unzip -o -q "$SRC" 2>/dev/null)
            for f in com/mojang/blaze3d/platform/InputConstants.java net/minecraft/client/gui/GuiGraphicsExtractor.java net/minecraft/client/gui/screens/Screen.java net/minecraft/client/input/KeyEvent.java net/minecraft/client/input/MouseButtonEvent.java net/minecraft/client/KeyMapping.java net/minecraft/client/Minecraft.java net/minecraft/client/gui/components/Button.java net/minecraft/client/gui/components/EditBox.java net/minecraft/client/renderer/texture/DynamicTexture.java com/mojang/blaze3d/platform/NativeImage.java net/minecraft/world/level/levelgen/Heightmap.java net/minecraft/world/level/ChunkPos.java net/minecraft/client/gui/Font.java net/minecraft/client/gui/Gui.java; do
              echo "--- FILE $f"
              if [ -f "srcs/$f" ]; then
