name: Build mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o -q simpleminimap_project.zip -d proj

      - name: Write fixed build.gradle
        run: |
          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'java'
              id 'net.minecraftforge.gradle' version '[7.0,)'
          }

          version = '1.5.0'
          group = 'ru.example'

          base {
              archivesName = 'simpleminimap'
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(25)

          minecraft {
              mappings channel: 'official', version: '26.3'
          }

          dependencies {
              minecraft "net.minecraftforge:forge:26.3-66.1.0"
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Build
        run: |
          PROJ=$(dirname "$(find proj -name build.gradle | head -1)")
          cd "$PROJ"
          gradle build --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Save full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: floppymap
          path: "**/build/libs/*.jar"
