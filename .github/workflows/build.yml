name: Build mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o -q simpleminimap_project.zip -d proj

      - name: Write fixed build.gradle
        run: |
          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'java'
              id 'net.minecraftforge.gradle' version '[7.0,)'
          }

          version = '1.5.0'
          group = 'ru.example'

          base {
              archivesName = 'simpleminimap'
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(25)

          minecraft {
              mappings channel: 'official', version: '26.3'
          }

          repositories {
              minecraft.mavenizer(it)
              maven fg.forgeMaven
              maven fg.minecraftLibsMaven
              mavenCentral()
          }

          dependencies {
              implementation minecraft.dependency("net.minecraftforge:forge:26.3-66.1.0")
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Build
        run: |
          PROJ=$(dirname "$(find proj -name build.gradle | head -1)")
          cd "$PROJ"
          gradle build --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Collect jar list
        if: always()
        run: |
          mkdir -p dump
          find /home/runner/.gradle/caches -name '*.jar' 2>/dev/null > dump/all-jars.txt
          grep -iE 'universal|forge' dump/all-jars.txt > dump/forge-jars.txt || true
          grep -i 'lwjgl' dump/all-jars.txt > dump/lwjgl-jars.txt || true
          wc -l dump/all-jars.txt dump/forge-jars.txt dump/lwjgl-jars.txt
          cat dump/lwjgl-jars.txt

      - name: List Forge events
        if: always()
        run: |
          FU=$(grep -i universal dump/forge-jars.txt | head -1)
          echo "jar: $FU"
          if [ -n "$FU" ]; then unzip -l "$FU" > dump/forge-listing.txt; fi
          grep -E 'eventbus|minecraftforge/event' dump/forge-listing.txt 2>/dev/null | grep '\.class' | sort -u | head -300 > dump/forge-events.txt || true
          wc -l dump/forge-events.txt || true
          head -120 dump/forge-events.txt

      - name: Javap key Forge classes
        if: always()
        run: |
          FU=$(grep -i universal dump/forge-jars.txt | head -1)
          echo "jar: $FU"
          javap -cp "$FU" net.minecraftforge.eventbus.api.listener.SubscribeEvent > dump/javap.txt 2>&1 || true
          javap -cp "$FU" net.minecraftforge.eventbus.api.IEventBus >> dump/javap.txt 2>&1 || true
          javap -cp "$FU" net.minecraftforge.client.event.RegisterGuiLayersEvent >> dump/javap.txt 2>&1 || true
          javap -cp "$FU" net.minecraftforge.client.event.RegisterKeyMappingsEvent >> dump/javap.txt 2>&1 || true
          javap -cp "$FU" net.minecraftforge.client.event.RenderGuiEvent >> dump/javap.txt 2>&1 || true
          javap -cp "$FU" net.minecraftforge.client.event.RenderGuiLayerEvent >> dump/javap.txt 2>&1 || true
          javap -cp "$FU" net.minecraftforge.client.extensions.IForgeGuiGraphicsExtractor >> dump/javap.txt 2>&1 || true
          javap -cp "$FU" net.minecraftforge.client.event.InputEvent >> dump/javap.txt 2>&1 || true
          cat dump/javap.txt

      - name: Extract MC sources
        if: always()
        run: |
          SRC=$(grep -i 'javadoc' dump/all-jars.txt | grep -iv 'universal' | head -1)
          echo "sources jar: $SRC"
          if [ -n "$SRC" ]; then
            mkdir -p dump/srcs
            (cd dump/srcs && unzip -o -q "$SRC") || true
