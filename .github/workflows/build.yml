name: Build mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o -q simpleminimap_project.zip -d proj

      - name: Write fixed build.gradle
        run: |
          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'java'
              id 'net.minecraftforge.gradle' version '[7.0,)'
          }

          version = '1.5.0'
          group = 'ru.example'

          base {
              archivesName = 'simpleminimap'
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(25)

          minecraft {
              mappings channel: 'official', version: '26.3'
          }

          repositories {
              minecraft.mavenizer(it)
              maven fg.forgeMaven
              maven fg.minecraftLibsMaven
              mavenCentral()
          }

          dependencies {
              implementation minecraft.dependency("net.minecraftforge:forge:26.3-66.1.0")
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Collect critical API information
        run: |
          set +e
          mkdir -p dump
          
          # Находим нужные jar-файлы
          FU=$(find /home/runner/.gradle/caches -name '*universal*.jar' 2>/dev/null | head -1)
          EB=$(find /home/runner/.gradle/caches -name '*eventbus*.jar' 2>/dev/null | head -1)
          
          # Собираем информацию о ключевых классах
          if [ -n "$FU" ]; then
            echo "Found Forge Universal JAR: $FU" >> dump/api-info.txt
            javap -cp "$FU" net.minecraftforge.client.event.InputEvent >> dump/api-info.txt 2>&1
            javap -cp "$FU" net.minecraftforge.client.extensions.IForgeGuiGraphicsExtractor >> dump/api-info.txt 2>&1
            javap -cp "$FU" net.minecraftforge.client.event.RegisterKeyMappingsEvent >> dump/api-info.txt 2>&1
          fi
          
          if [ -n "$EB" ]; then
            echo "Found EventBus JAR: $EB" >> dump/api-info.txt
            javap -cp "$EB" net.minecraftforge.eventbus.api.listener.SubscribeEvent >> dump/api-info.txt 2>&1
            javap -cp "$EB" net.minecraftforge.eventbus.api.bus.EventBus >> dump/api-info.txt 2>&1
          fi
          
          # Ищем исходники Minecraft
          SRC=$(find /home/runner/.gradle/caches -name '*javadoc*.jar' 2>/dev/null | head -1)
          if [ -n "$SRC" ]; then
            echo "Found Sources JAR: $SRC" >> dump/api-info.txt
            unzip -l "$SRC" | grep -E 'Screen|GuiGraphicsExtractor|KeyEvent|MouseButtonEvent' >> dump/api-info.txt
          fi

      - name: Save API dump
        uses: actions/upload-artifact@v4
        with:
          name: api-dump
          path: dump

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-
