name: Build mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o -q simpleminimap_project.zip -d proj

      - name: Write fixed build.gradle
        run: |
          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'java'
              id 'net.minecraftforge.gradle' version '[7.0,)'
          }

          version = '1.5.0'
          group = 'ru.example'

          base {
              archivesName = 'simpleminimap'
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(25)

          minecraft {
              mappings channel: 'official', version: '26.3'
          }

          repositories {
              minecraft.mavenizer(it)
              maven fg.forgeMaven
              maven fg.minecraftLibsMaven
              mavenCentral()
          }

          dependencies {
              implementation minecraft.dependency("net.minecraftforge:forge:26.3-66.1.0")
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Build
        run: |
          PROJ=$(dirname "$(find proj -name build.gradle | head -1)")
          cd "$PROJ"
          gradle build --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log" || true

      - name: Dump API
        if: always()
        run: |
          cat > dump_api.sh <<'SCRIPT'
          #!/bin/bash
          set +e
          mkdir -p dump
          find /home/runner/.gradle/caches -name '*.jar' 2>/dev/null | grep -v sources > dump/all-jars.txt
          FU=$(grep -i universal dump/all-jars.txt | head -1)
          EB=$(grep -i eventbus dump/all-jars.txt | head -1)
          echo "universal jar: $FU"
          echo "eventbus jar:  $EB"
          if [ -n "$FU" ]; then
            unzip -l "$FU" > dump/forge-listing.txt 2>/dev/null
            grep 'net/minecraftforge/client/event' dump/forge-listing.txt | grep '\.class' | sort -u > dump/events-client.txt
            wc -l dump/events-client.txt
            echo "=== CLIENT EVENTS (all) ==="
            cat dump/events-client.txt
            echo "=== JAVAP FORGE ==="
            for c in net.minecraftforge.client.event.InputEvent net.minecraftforge.client.event.InputEvent\$MouseButtonPressed net.minecraftforge.client.event.InputEvent\$MouseButtonReleased net.minecraftforge.client.event.InputEvent\$Key net.minecraftforge.client.event.RegisterKeyMappingsEvent net.minecraftforge.client.event.ClientTickEvent net.minecraftforge.event.TickEvent net.minecraftforge.client.extensions.IForgeGuiGraphicsExtractor; do
              echo "--- $c" >> dump/javap.txt
              javap -cp "$FU" "$c" >> dump/javap.txt 2>&1
            done
            cat dump/javap.txt
          fi
          if [ -n "$EB" ]; then
            echo "=== JAVAP EVENTBUS ==="
            for c in net.minecraftforge.eventbus.api.listener.SubscribeEvent net.minecraftforge.eventbus.api.bus.EventBus net.minecraftforge.eventbus.api.event.MutableEvent; do
              echo "--- $c" >> dump/eventbus.txt
              javap -cp "$EB" "$c" >> dump/eventbus.txt 2>&1
            done
            cat dump/eventbus.txt
          fi
          SRC=$(find /home/runner/.gradle/caches -name '*javadoc*.jar' 2>/dev/null | head -1)
          echo "sources jar: $SRC"
          if [ -n "$SRC" ]; then
            unzip -l "$SRC" > dump/src-listing.txt 2>/dev/null
            wc -l dump/src-listing.txtfor n in GuiGraphicsExtractor Screen KeyEvent MouseButtonEvent KeyMapping Minecraft InputConstants DynamicTexture NativeImage ChunkPos Font Gui RenderSystem PoseStack DeltaTracker Button EditBox Heightmap; do
              echo "=== $n ===" >> dump/mc-sigs.txt
              f=$(grep -E "/${n}\.java$" dump/src-listing.txt | head -1 | awk '{print $4}')
              if [ -n "$f" ]; then
                unzip -p "$SRC" "$f" 2>/dev/null | grep -E '(public|protected) ' | head -80 >> dump/mc-sigs.txt
              else
                echo "NOT FOUND" >> dump/mc-sigs.txt
              fi
            done
            cat dump/mc-sigs.txt
          fi
          SCRIPT
          bash dump_api.sh || true

      - name: Save API dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-dump
          path: dump

      - name: Save full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
