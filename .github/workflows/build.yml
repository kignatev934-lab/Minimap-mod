name: Build mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o *.zip -d proj

      - name: Show project config
        run: |
          echo "=== Файлы проекта ==="
          find proj -type f | head -40
          echo "=== build.gradle ==="
          cat "$(find proj -name build.gradle | head -1)"
          echo "=== gradle.properties ==="
          cat "$(find proj -name gradle.properties | head -1)" || true
          echo "=== wrapper ==="
          cat "$(find proj -path '*wrapper*' -name '*.properties' | head -1)" || true

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: |
          GW=$(find proj -name gradlew | head -1)
          if [ -n "$GW" ]; then
            chmod +x "$GW"
            cd "$(dirname "$GW")"
            ./gradlew build --no-daemon
          else
            PROJ=$(dirname "$(find proj -name build.gradle | head -1)")
            cd "$PROJ"
            gradle build --no-daemon
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: floppymap
          path: "**/build/libs/*.jar"
