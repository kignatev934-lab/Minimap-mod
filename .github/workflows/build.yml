name: Build mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o -q simpleminimap_project.zip -d proj

      - name: Write fixed build.gradle
        run: |
          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'java'
              id 'net.minecraftforge.gradle' version '[7.0,)'
          }

          version = '1.5.0'
          group = 'ru.example'

          base {
              archivesName = 'simpleminimap'
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(25)

          minecraft {
              mappings channel: 'official', version: '26.3'
          }

          repositories {
              minecraft.mavenizer(it)
              maven fg.forgeMaven
              maven fg.minecraftLibsMaven
              mavenCentral()
          }

          dependencies {
              implementation minecraft.dependency("net.minecraftforge:forge:26.3-66.1.0")
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Check dependencies
        run: |
          PROJ=$(dirname "$(find proj -name build.gradle | head -1)")
          cd "$PROJ"
          gradle dependencies --configuration compileClasspath

      - name: List downloaded jars
        run: |
          find /home/runner/.gradle/caches -name '*.jar' | grep forge

      - name: Save dependencies list
        uses: actions/upload-artifact@v4
        with:
          name: dependencies
          path: /home/runner/.gradle/caches
