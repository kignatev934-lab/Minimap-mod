name: Build mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o *.zip -d proj

      - name: Upgrade ForgeGradle to 7
        run: |
          sed -i "s|id 'net.minecraftforge.gradle'.*|id 'net.minecraftforge.gradle' version '[7.0,)'|" proj/build.gradle
          echo "=== Проверка замены ==="
          head -6 proj/build.gradle

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Build
        run: |
          PROJ=$(dirname "$(find proj -name build.gradle | head -1)")
          cd "$PROJ"
          gradle build --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Save full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: floppymap
          path: "**/build/libs/*.jar"
