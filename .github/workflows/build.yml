name: Build mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o *.zip -d proj
          find proj -maxdepth 2

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        run: |
          GW=$(find proj -name gradlew | head -1)
          chmod +x "$GW"
          cd "$(dirname "$GW")"
          ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: floppymap
          path: "**/build/libs/*.jar"
