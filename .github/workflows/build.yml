name: Build mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o -q simpleminimap_project.zip -d proj

      - name: Write fixed build.gradle
        run: |
          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'java'
              id 'net.minecraftforge.gradle' version '[7.0,)'
          }

          version = '1.5.0'
          group = 'ru.example'

          base {
              archivesName = 'simpleminimap'
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(25)

          minecraft {
              mappings channel: 'official', version: '26.3'
              forceReload = true
              cacheOnly = false
          }

          repositories {
              minecraft.mavenizer(it)
              maven fg.forgeMaven
              maven fg.minecraftLibsMaven
              mavenCentral()
          }

          dependencies {
              implementation minecraft.dependency("net.minecraftforge:forge:26.3-66.1.0")
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Collect API information
        run: |
          PROJ=$(dirname "$(find proj -name build.gradle | head -1)")
          cd "$PROJ"
          
          # Собираем информацию о классах
          mkdir -p dump
          
          # Список всех jar-файлов
          find /home/runner/.gradle/caches -name '*.jar' > dump/all-jars.txt
          
          # Извлекаем список классов
          for jar in $(grep -i universal dump/all-jars.txt); do
            unzip -l "$jar" >> dump/classes.txt
          done
          
          # Ищем ключевые классы
          grep -E 'eventbus|minecraftforge/event' dump/classes.txt | grep '.class' > dump/events.txt
          
          # Сохраняем информацию о версиях
          echo "ForgeGradle version: $(gradle -q forgegradle.version)" > dump/versions.txt
          
          # Собираем сигнатуры ключевых классов
          javap -cp "$(find /home/runner/.gradle/caches -name '*universal*.jar')" net.minecraftforge.eventbus.api.listener.SubscribeEvent > dump/javap.txt 2>&1
          javap -cp "$(find /home/runner/.gradle/caches -name '*universal*.jar')" net.minecraftforge.client.event.RegisterGuiLayersEvent >> dump/javap.txt 2>&1
          
      - name: Save API dump
        uses: actions/upload-artifact@v4
        with:
          name: api-dump
          path: dump

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
